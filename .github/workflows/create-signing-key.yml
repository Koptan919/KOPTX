name: Create signing key
# One-time setup. Generates the permanent APK signing key on the runner, encrypts it with the
# repository secret KEYSTORE_PASSWORD (chosen by the owner, never printed) and commits only the
# encrypted file + the public certificate fingerprint. Refuses to run if a key already exists:
# replacing the key would stop new APKs from installing over the existing app.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  key:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preconditions
        run: |
          if [ -z "$PW" ]; then echo "::error::Add the repository secret KEYSTORE_PASSWORD first (Settings > Secrets and variables > Actions)."; exit 1; fi
          if [ ${#PW} -lt 12 ]; then echo "::error::KEYSTORE_PASSWORD must be at least 12 characters."; exit 1; fi
          if [ -f signing/koptan.jks.enc ]; then echo "::error::A signing key already exists. It must never be replaced."; exit 1; fi
      - name: Generate, encrypt, commit
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/koptan.jks"
          keytool -genkeypair -storetype PKCS12 -keystore "$K" -alias koptan -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PW" -keypass "$PW" -dname "CN=KOPTAN, O=Koptan, C=LB"
          mkdir -p signing
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$K" -out signing/koptan.jks.enc -pass env:PW
          # verify the encrypted copy decrypts to the same key before committing
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/koptan.jks.enc -out "$K.chk" -pass env:PW
          cmp "$K" "$K.chk"
          FP=$(keytool -list -v -keystore "$K" -storepass "$PW" | sed -n 's/.*SHA256: *//p' | head -1)
          [ -n "$FP" ]
          echo "$FP" > signing/fingerprint-sha256.txt
          rm -f "$K" "$K.chk"
          echo "Certificate SHA-256: $FP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/koptan.jks.enc signing/fingerprint-sha256.txt
          git commit -m "Add encrypted APK signing key (alias koptan) and public fingerprint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
