name: Verify live site
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Check the deployed app
        run: |
          cat > check.js <<'JS'
          const {chromium}=require('playwright');
          const URL='https://koptan919.github.io/KOPTX/';
          (async()=>{const b=await chromium.launch();const ctx=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const p=await ctx.newPage();
          const errs=[];p.on('pageerror',e=>errs.push(e.message));const R=[];const ok=(c,m)=>{R.push((c?'PASS ':'FAIL ')+m);if(!c)process.exitCode=1};
          await p.goto(URL,{waitUntil:'networkidle'});await p.waitForSelector('body.ready',{timeout:20000});
          const live=await p.evaluate(()=>APP_VER);const vj=await (await fetch(URL+'version.json?t='+Date.now())).json();ok(vj.version===live,'version.json ('+vj.version+') matches live app ('+live+')');
          const zr=await fetch(vj.zip);const zb=Buffer.from(await zr.arrayBuffer());ok(zr.ok&&zb.slice(0,2).toString()==='PK'&&zb.includes('index.html')&&zb.includes('core.js'),'Android update bundle downloadable ('+zb.length+' bytes)');
          ok(await p.locator('#nav button').count()===5,'navigation rendered');
          await p.waitForFunction(()=>navigator.serviceWorker&&navigator.serviceWorker.controller,null,{timeout:20000}).catch(()=>{});
          await p.reload({waitUntil:'networkidle'});await p.waitForSelector('body.ready');
          ok(await p.evaluate(()=>!!navigator.serviceWorker.controller),'service worker controls the page');
          ok(await p.evaluate(async()=>(await caches.keys()).includes('koptan-v'+APP_VER)),'current cache installed');
          await p.click('#fab');await p.waitForTimeout(400);await p.click('.sheet.qa [data-a=p]');await p.waitForTimeout(500);
          const pg=p.locator('.pg').last();await pg.locator('[name=name]').fill('Live check');await pg.locator('[name=price]').fill('9');await pg.locator('#sv').click();await p.waitForTimeout(800);
          await p.reload();await p.waitForSelector('body.ready');ok(await p.evaluate(()=>S.p.some(x=>x.name==='Live check')),'product saved and survives reload');
          await ctx.setOffline(true);await p.reload();await p.waitForSelector('body.ready',{timeout:20000});ok(await p.evaluate(()=>S.p.length)>=1,'app opens offline with data');await ctx.setOffline(false);
          await p.evaluate(()=>setLang('en'));await p.waitForTimeout(300);ok(await p.evaluate(()=>document.documentElement.dir)==='ltr','English switches to LTR');
          await p.screenshot({path:'live.png'});
          ok(errs.length===0,'no JS errors '+errs.join('|'));console.log(R.join('\n'));await b.close()})();
          JS
          node check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshot
          path: live.png
