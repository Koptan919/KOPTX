name: Build IPA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare project
        run: |
          mkdir -p app/www
          cp index.html sw.js manifest.json icon-192.png icon-512.png app/www/
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init KOPTAN com.koptan.app --web-dir www
          npx cap add ios
          PLIST=ios/App/App/Info.plist
          plutil -insert NSCameraUsageDescription -string "KOPTAN uses the camera to scan barcodes and take photos." "$PLIST"
          npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd app/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/KOPTAN.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KOPTAN-ipa
          path: KOPTAN.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${{ github.run_number }}"
          gh release create "$TAG" KOPTAN.ipa --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "KOPTAN iOS $TAG" --notes "Unsigned IPA: install with Sideloadly or AltStore." --latest=false
