<style>
:root{color-scheme:dark;--bg:#04060c;--s1:#0c1220;--s2:#141d33;--tx:#eef1f5;--mu:#b8c2d4;--bl:#3d8bff;--gr:#2fd47a;--rd:#ff5468;--or:#ffa13a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:90px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
h1{font-size:20px;font-weight:800}.sub{color:var(--mu);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
.ib{min-width:44px;min-height:44px;border-radius:14px;border:0;background:var(--s1);font-weight:700;cursor:pointer}
.ib:active,.card:active,.btn:active{transform:scale(.97)}
.wrap{padding:0 16px 16px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:linear-gradient(160deg,#101a30,var(--s1));border:1px solid #1a2440;border-radius:16px;padding:11px 13px;transition:transform .12s}
.card b{display:block;font-size:18px;font-weight:800;margin-top:4px}
.card span{color:var(--mu);font-size:12px}
.g{color:var(--gr)}.r{color:var(--rd)}.o{color:var(--or)}.bl{color:var(--bl)}
h2{font-size:15px;margin:16px 0 8px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:16px;padding:10px;margin-bottom:8px;min-height:64px;cursor:pointer}
.row .t{flex:1;min-width:0}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:48px;height:48px;border-radius:12px;background:var(--s2) center/cover;flex:none;display:grid;place-items:center;font-size:20px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu)}
nav{position:fixed;bottom:0;inset-inline:0;background:#080d18;border-top:1px solid #1a2440;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-height:52px;border:0;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--bl);font-weight:700}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:17px;border:0;background:var(--bl);color:#fff;font-size:28px;box-shadow:0 6px 20px #3d8bff55;z-index:5;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--s1);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;min-height:44px;background:var(--s2);border:1px solid #22304d;border-radius:12px;padding:8px 12px}
.btn{min-height:46px;border:0;border-radius:14px;padding:0 16px;font-weight:700;background:var(--s2);cursor:pointer;transition:transform .12s}
.btn.p{background:var(--bl);color:#fff}.btn.d{background:#3a1a20;color:var(--rd)}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.bar .btn{flex:1}
.empty{text-align:center;color:var(--mu);padding:40px 10px}.empty .btn{margin-top:12px}
.search{width:100%;min-height:44px;background:var(--s1);border:0;border-radius:14px;padding:8px 14px;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.chart i{flex:1;border-radius:6px 6px 2px 2px;background:var(--bl);min-height:3px;cursor:pointer;position:relative}
.chart i.n{background:var(--rd)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a2440}.kv span:first-child{color:var(--mu)}
.note{background:#2a2113;color:var(--or);border-radius:12px;padding:10px;font-size:12px;margin-bottom:10px}
.sk{height:84px;animation:pl .8s infinite alternate}@keyframes pl{from{opacity:.4}}
body{min-height:100vh;padding-bottom:140px}[hidden]{display:none!important}.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}.bar .btn{flex:1 1 auto}
.si{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sb{position:relative;display:flex;gap:8px;margin-bottom:10px}.sb>.si{position:absolute;inset-inline-start:14px;top:15px;color:var(--mu)}.sb .search{margin:0;padding-inline-start:46px;flex:1;min-height:52px;font-size:16px}.sb .ib{background:var(--s1);color:var(--bl);min-width:52px;display:grid;place-items:center}
.fch{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}.fch::-webkit-scrollbar{display:none}.fch button{flex:none;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid #22304d;background:var(--s1);color:var(--mu);cursor:pointer;transition:transform .12s}.fch button:active{transform:scale(.95)}.fch button.on{background:var(--bl);border-color:var(--bl);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc{background:var(--s1);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .12s;border:1px solid #1a2440}.pc:active{transform:scale(.97)}.pi{aspect-ratio:1/1;background:var(--s2) center/cover;position:relative;display:grid;place-items:center;color:var(--mu)}.pi .si{width:44px;height:44px}.pb{padding:10px 12px 12px}.pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 2px;gap:6px}.pr b{font-size:16px}.pr span{font-size:13px;font-weight:700}
.bd{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#000c}.bd.g{color:var(--gr)}.bd.o{color:var(--or)}.bd.r{color:var(--rd)}.fv{position:absolute;top:6px;inset-inline-end:8px}
.ac{background:var(--s2);border-radius:16px;margin-bottom:8px;overflow:hidden}.ac summary{min-height:50px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer;list-style:none;justify-content:space-between}.ac summary::-webkit-details-marker{display:none}.ac summary::after{content:'▾';color:var(--mu);transition:transform .2s}.ac[open] summary::after{transform:rotate(180deg)}.ac .ab{padding:0 14px 12px;animation:in .2s}
.hero{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px}.hero>div,.hero>img{width:100%;flex:none;height:230px;object-fit:cover;border-radius:18px;scroll-snap-align:center;background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.mn{position:absolute;bottom:3px;inset-inline-start:3px;background:var(--bl);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;text-decoration:none}.zm{position:fixed;inset:0;background:#000e;z-index:60;display:grid;place-items:center;overflow:auto;touch-action:pinch-zoom}.zm img{max-width:100%;max-height:100%;object-fit:contain}
.pg{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .25s ease}.pg .sc{flex:1;overflow:auto;padding:0 16px 24px}
.pg .ft{display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#080d18;border-top:1px solid #1a2440}
.fl{margin-bottom:12px}.fl label{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}.fl input,.fl select,.fl textarea{width:100%;min-height:52px;font-size:17px;background:var(--s1);border:1px solid #22304d;border-radius:14px;padding:8px 14px}.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--bl);border-color:transparent}.fl input.big{font-size:34px;font-weight:800;text-align:center;min-height:72px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chp button{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid #22304d;background:var(--s1);cursor:pointer;transition:transform .12s,background .15s}.chp button:active{transform:scale(.96)}.chp button.on{background:var(--bl);border-color:var(--bl);color:#fff}
.ct{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.ct button{min-height:68px;border-radius:14px;border:1px solid #22304d;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:pointer;transition:transform .12s}.ct button b{font-size:24px}.ct button.on{background:var(--bl);border-color:var(--bl);color:#fff}.ct button:active{transform:scale(.95)}
.ph{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}.ph>div{width:88px;height:88px;flex:none;border-radius:14px;background:var(--s1) center/cover;position:relative;display:grid;place-items:center;font-size:30px;cursor:pointer;border:1px dashed #22304d}.ph i{position:absolute;top:3px;inset-inline-end:3px;background:#000b;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:12px}
.ib .si{display:block;margin:auto}
.ph b{position:absolute;bottom:3px;inset-inline-start:3px;background:#000b;color:#ffd24a;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:400}
.ph u{position:absolute;bottom:3px;inset-inline-end:3px;background:#000b;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:13px;text-decoration:none}
.zm .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;width:48px;height:48px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:20px;z-index:2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.cal .wd{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}.cd{min-height:48px;border-radius:12px;border:1px solid transparent;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.cd.tdy{border-color:var(--bl)}.cd.on{background:var(--bl);color:#fff}.cd span{display:flex;gap:2px;height:6px}.cd u{width:6px;height:6px;border-radius:50%;display:block}.cd .ks{background:var(--gr)}.cd .ke{background:var(--or)}.cd .kd{background:var(--rd)}
.ov{border:1px solid #5a1f2b!important;background:#1a0c14!important}
.sel{width:100%;min-height:46px;background:var(--s1);border:1px solid #22304d;border-radius:14px;padding:8px 12px;margin-bottom:10px}
.cts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.cts.two{grid-template-columns:1fr 1fr}.cb{min-height:50px;border-radius:14px;border:1px solid #22304d;background:var(--s2);color:var(--tx);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;transition:transform .12s;white-space:nowrap}.cb:active{transform:scale(.96)}.cb svg{width:20px;height:20px;flex:none}.cb.tel{color:#6fb0ff}.cb.wa{background:#0d3321;border-color:#25D366;color:#25D366}.cb.link{color:#c4b5fd}.cb.off{opacity:.6}.wi{fill:currentColor;stroke:none!important}
.qs-bg{position:fixed;left:0;right:0;top:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:#000a;z-index:20;display:flex;align-items:flex-end;animation:fd .2s}.qs-bg.out{opacity:0;transition:opacity .19s}
.qs{width:100%;background:var(--s1);border-radius:24px 24px 0 0;padding:8px 16px 16px;border:1px solid #1a2440;border-bottom:0;animation:up .28s cubic-bezier(.2,.9,.3,1);touch-action:none}.qs h2{margin:4px 0 12px;font-size:16px}
.grip{width:42px;height:4px;border-radius:4px;background:#2d4170;margin:4px auto 8px}.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{min-height:108px;border-radius:18px;background:var(--s2);border:1px solid #22304d;color:var(--tx);display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;text-align:start;cursor:pointer;transition:transform .12s,border-color .15s}.qc:active{transform:scale(.96);border-color:var(--bl)}.qc .qi{width:40px;height:40px;border-radius:12px;background:#12315f;color:#7db4ff;display:grid;place-items:center;margin-bottom:4px}.qc .qi svg{width:24px;height:24px}.qc b{font-size:15px}.qc small{color:var(--mu);font-size:12px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v7 ===== */
:root{--line:#1a2440;--nh:72px}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:Tajawal,'Noto Sans Arabic','Segoe UI',system-ui,sans-serif;padding-bottom:calc(var(--nh) + 90px);min-height:100dvh}
h1,h2{overflow-wrap:anywhere}.wrap{animation:none;overflow-wrap:anywhere}
input[type=number],input[type=tel],input[type=url],input[type=date]{direction:ltr;text-align:right}
input::placeholder{color:#5d6b88}
button{cursor:pointer}
.si{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.si.xs{width:14px;height:14px;vertical-align:-2px}
/* press feedback */
button:active:not(:disabled),.row:active,.pc:active,.mi:active,.qc:active,.card[onclick]:active,.dsm:active{transform:scale(.97)}
.row,.pc,.mi,.card,.btn,.qa button,nav button{transition:transform .12s,background .2s,border-color .2s}
/* header */
header{padding:12px 16px 8px}header h1{line-height:1.2}.hb2{display:flex;gap:6px}.hb2 .ib{background:var(--s1);border:1px solid var(--line);color:var(--tx)}
header.ph2{display:flex;justify-content:flex-start;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}header.ph2 h1{font-size:18px;flex:1;min-width:0}
/* toast */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:92vw;background:#14213f;color:#fff;border:1px solid #2a3f73;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:80;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #000a;animation:tin .28s cubic-bezier(.2,.9,.3,1)}
.toast.ok svg{color:var(--gr)}.toast.w svg{color:var(--or)}.toast.out{opacity:0;transition:opacity .22s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
.spin{width:18px;height:18px;border:2px solid #3d8bff55;border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
/* nav */
nav{background:#070b15f0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
nav .ind{position:absolute;top:6px;left:0;height:54px;border-radius:18px;background:#10244d;transition:transform .32s cubic-bezier(.3,.9,.3,1),width .3s;pointer-events:none}
nav button{position:relative;z-index:1;min-height:54px;font-size:11.5px;font-weight:700;gap:3px}nav button svg{width:26px;height:26px;transition:transform .25s}nav button.on svg{transform:translateY(-1px) scale(1.1)}
.fab{bottom:calc(var(--nh) + 14px);width:54px;height:54px;display:grid;place-items:center;padding:0;transition:transform .15s}.fab svg{width:26px;height:26px}.fab:active{transform:scale(.92)}
.qs-bg{bottom:var(--nh)}
/* enter animation */
.enter .wrap>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.noanim *{animation:none!important;transition:none!important}
/* hero */
.hero2{position:relative;border-radius:24px;padding:16px 18px;background:radial-gradient(120% 130% at 0% 0%,#1d4290 0%,#0f2152 48%,#0a1530 100%);border:1px solid #23407f;box-shadow:0 10px 30px #0a1a4a66;overflow:hidden;margin-bottom:14px}
.hero2:before{content:'';position:absolute;inset:auto -50px -70px auto;width:200px;height:200px;border-radius:50%;background:#3d8bff1f;pointer-events:none}
.hr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.hr-top>span{color:#b8c8ee;font-size:13px;font-weight:700}
.seg{display:flex;background:#0a1630bb;border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:none;color:#9fb2dc;min-height:34px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}.seg button.on{background:var(--bl);color:#fff}
.hr-big{font-size:36px;font-weight:800;margin:8px 0 4px;line-height:1.2}.hr-big .cnt{display:inline}.hr-big .r{color:var(--rd)}
.hr-d{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:#0a1630bb}.hr-d .si{width:15px;height:15px}
.hr-s{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.hr-s>div{background:#0a163099;border-radius:14px;padding:10px 12px;min-width:0}.hr-s span{display:block;color:#a9bbe3;font-size:12px}.hr-s b{font-size:17px;font-weight:800}
/* shortcuts / tiles */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--tx);padding:4px 0;min-width:0;line-height:1.3;text-align:center}
.ti{display:grid;place-items:center;flex:none;border-radius:16px}.qa .ti{width:56px;height:56px;border-radius:18px}.qa .ti svg{width:26px;height:26px}
.t-b{background:#12315f;color:#7db4ff}.t-g{background:#0e3a29;color:var(--gr)}.t-o{background:#3d2a12;color:var(--or)}.t-r{background:#40161f;color:var(--rd)}
.th.t-b,.th.t-g,.th.t-o,.th.t-r{display:grid;place-items:center}.th .si{width:22px;height:22px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;gap:8px}.sh h2{margin:0}.sh>button:not(.on){border:0;background:none;color:var(--bl);font-weight:700;min-height:36px;padding:0 4px}.sh .seg button{min-height:32px}
.row .b{font-weight:800}.stf{color:#ffd24a;display:inline-flex}.stf svg{width:13px;height:13px;fill:currentColor}
/* debt summary + chart */
.dsm{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}.dsm>div:not(.dod){min-width:0}.dsm span{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:12px}.dsm b{font-size:19px;font-weight:800;display:block;margin-top:2px}
.dod{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--rd);font-size:13px;font-weight:700;background:#1a0c14;border:1px solid #5a1f2b;border-radius:12px;padding:8px 10px}.dod .si{width:18px;height:18px}
.chart{height:104px;gap:6px}.chart i{transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms);transition:filter .15s}.chart i.sel{filter:brightness(1.5);outline:2px solid #fff3}.chart.dense{gap:2px}.chart.dense i{border-radius:3px 3px 1px 1px}
@keyframes grow{from{transform:scaleY(.05);opacity:.4}}
.ctip{font-size:13px;color:var(--mu);min-height:20px}.ctip b{display:inline;margin:0 4px;font-size:14px}.cax{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:6px}
/* products */

/* ---------- storage ---------- */
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('pbm',5);r.onupgradeneeded=()=>{['p','s','e','k','l','t','d','img','sp'].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const tx=(st,m)=>db.transaction(st,m).objectStore(st);
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
async function put(st,o){if(memOnly)return;try{await rq(tx(st,'readwrite').put(o))}catch(e){toast('تعذر الحفظ: '+e.name)}}

/* ---------- backup / export ---------- */
function dl(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type});if(typeof window.appSaveFile==='function')return window.appSaveFile(name,blob);const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}
const exportJ=async()=>{const done=toastP('جارٍ تجهيز النسخة…');try{const imgs=await expImgs();dl('backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:4,at:Date.now(),sp:S.sp,p:S.p,s:S.s,e:S.e,l:S.l,t:S.t,d:S.d,k:S.k,imgs}),'application/json');S.k.lastBk=Date.now();await saveK();done();toast('تم إنشاء النسخة الاحتياطية (شاملة الصور) ✓');render()}catch(e){done();toast('تعذر إنشاء النسخة')}};
async function importJ(f){let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.p)||!Array.isArray(d.s)||!Array.isArray(d.e)||d.p.some(p=>!p.id||!p.name)||d.s.some(s=>!s.id||!s.pid))throw 0}catch(e){toast('ملف النسخة غير صالح');return}
confirmBox(`استبدال البيانات الحالية بنسخة فيها ${d.p.length} منتج و${d.s.length} بيع و${(d.d||[]).length} دين؟`,async()=>{const t_=toastP('جارٍ الاستعادة…'),old={};['p','s','e','l','t','d','sp'].forEach(n=>old[n]=S[n]);const oldK={...S.k};
try{await restImgs(d.imgs||[]);for(const n of['p','s','e','l','t','d','sp']){for(const o of old[n])await del(n,o.id);S[n]=d[n]||[];for(const o of S[n])await put(n,o)}S.k={...S.k,...(d.k||{})};delete S.k.id;await saveK();await migImgs();await migSup(true);t_();toast('تمت الاستعادة بنجاح ✓');render()}
catch(e){for(const n of['p','s','e','l','t','d','sp']){for(const o of S[n])await del(n,o.id);S[n]=old[n];for(const o of S[n])await put(n,o)}S.k=oldK;await saveK();t_();toast('فشلت الاستعادة — أُعيدت بياناتك كما كانت');render()}})}

/* ---------- v7 expenses ---------- */
const XC=[['rent',LU.home,'إيجار'],['ship',LU.truck,'شحن'],['ads',LU.mega,'إعلانات'],['pack',LU.pkg,'تغليف'],['fuel',LU.fuel,'وقود'],['tools',LU.wrench,'أدوات'],['sal',LU.user,'رواتب'],['other',LI.receipt,'أخرى']],XP=[['cash','نقدًا'],['card','بطاقة'],['bank','تحويل'],['wal','محفظة']],XR=[['','لا يتكرر'],['w','أسبوعيًا'],['m','شهريًا']];
const xi=c=>SV((XC.find(x=>x[0]===c)||XC[7])[1]);
function expensePage(e0){const e=e0?{...e0}:{},st={cat:e.cat||'other',pay:e.pay||'cash',rec:e.rec||''};let cu='USD',img=e.img||'';
const chip=(g,a)=>`<div class="chp">${a.map(([v,l])=>`<button type="button" data-g="${g}" data-v="${v}" class="${st[g]===v?'on':''}">${l}</button>`).join('')}</div>`,sel=(n,l,o,val)=>`<div class="fl"><label>${l}</label><select name="${n}"><option value="">بدون ربط</option>${o.map(([a,b])=>`<option value="${a}" ${a===val?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
const P=page(e0?'تعديل المصروف':'مصروف جديد',`<div class="fl"><label>المبلغ</label><input name="amt" class="big" type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="${e.amt||''}"></div><div class="chp"><button type="button" data-g="cu" data-v="USD" class="on">دولار $</button><button type="button" data-g="cu" data-v="LBP">ليرة ل.ل</button></div>
<label class="sub">التصنيف</label><div class="ct">${XC.map(([k,i,l])=>`<button type="button" data-g="cat" data-v="${k}" class="${st.cat===k?'on':''}"><b>${SV(i)}</b>${l}</button>`).join('')}</div>
<div class="fl"><label>التاريخ</label><input name="date" type="date" value="${toDs(e.date)||toDs(Date.now())}"></div>
<details class="ac" ${e.note&&e.note!==(XC.find(x=>x[0]===e.cat)||[])[2]||e.notes||e.img||e.pid||e.sid?'open':''}><summary>خيارات إضافية (اختياري)</summary><div class="ab"><div class="fl"><label>الوصف</label><input name="note" value="${esc(e.note||'')}" autocomplete="off"></div><div class="fl"><label>ملاحظات</label><textarea name="notes" rows="2">${esc(e.notes||'')}</textarea></div><label class="sub">صورة الفاتورة</label><div class="ph" id="ph"></div><label class="sub">طريقة الدفع</label>${chip('pay',XP)}${e0?'':`<label class="sub">التكرار</label>${chip('rec',XR)}`}${sel('pid','مرتبط بمنتج',S.p.map(p=>[p.id,p.name]),e.pid)}${sel('sid','مرتبط بعملية بيع',[...S.s].sort((a,b)=>b.date-a.date).slice(0,40).map(s=>[s.id,s.name+' × '+s.qty+' — '+day(s.date)]),e.sid)}</div></details>`,
e0?`<button class="btn d" id="dl">${SV(LU.trash)} حذف</button>`:'',async P=>{
const a=+P.q('amt').value;if(!(a>0)){P.q('amt').focus();toast('أدخل مبلغًا أكبر من صفر');return false}
const date=toTs(P.q('date').value)||Date.now(),o={amt:num(cu==='LBP'?a/S.k.rate:a),cur:cu,orig:a,rate:S.k.rate,cat:st.cat,pay:st.pay,note:P.q('note').value.trim()||XC.find(x=>x[0]===st.cat)[2],notes:P.q('notes').value.trim(),date,pid:P.q('pid').value,sid:P.q('sid').value,img};
let x;if(e0){x=e0;Object.assign(x,o)}else{x={id:uid(),...o,rec:st.rec,next:st.rec?addR(date,st.rec):0};S.e.push(x)}
await put('e',x);gcImgs([e.img]);log('مصروف: '+x.note+' '+fmt(x.amt));toast(e0?'تم تحديث المصروف ✓':'تمت إضافة المصروف ✓');render()});
const ph=()=>{P.d.querySelector('#ph').innerHTML=img?`<div ${ibg(img)} data-zi="1"><u data-zm="1">${SV(LU.search)}</u><i data-rm="1">${SV(LU.x)}</i></div>`:ADDT(false)};
P.d.addEventListener('click',t=>{t=t.target;if(t.closest('[data-add]'))return;if(t.closest('[data-rm]')){img='';ph()}else if(t.closest('[data-zm],[data-zi]'))zoomId(img)});P.d._imgCb=a=>{img=a[0]||'';ph();P.d.dispatchEvent(new Event('input'))};
grp(P,st,(g,val)=>{if(g!=='cu')return true;if(val!==cu){cu=val;P.d.querySelectorAll('[data-g=cu]').forEach(x=>x.classList.toggle('on',x.dataset.v===val))}return false});ph();
const dl_=P.d.querySelector('#dl');if(dl_)dl_.onclick=()=>confirmBox('حذف هذا المصروف؟',async()=>{S.e=S.e.filter(x=>x.id!==e0.id);await del('e',e0.id);gcImgs([e0.img]);P.close();toast('تم الحذف ✓');render()})}

function quickAdd(){if(document.querySelector('.qs-bg'))return;closeSheets();buzz();
const A=[['p',IC.box,'إضافة منتج','منتج جديد للمخزون',()=>addProduct()],['s',IC.cart,'تسجيل بيع','بيع من المخزون',()=>sellForm()],['e',LI.receipt,'إضافة مصروف','إيجار، شحن، إعلانات…',()=>addExpense()],['d',LI.card,'إضافة دين','لي أو عليّ مع دفعات',()=>debtPage()]];
const bg=document.createElement('div');bg.className='qs-bg';bg.innerHTML=`<div class="qs" role="dialog" aria-label="إضافة سريعة"><div class="grip"></div><h2>إضافة سريعة</h2><div class="qg">${A.map(a=>`<button class="qc" data-a="${a[0]}"><span class="qi">${SV(a[1])}</span><b>${a[2]}</b><small>${a[3]}</small></button>`).join('')}</div></div>`;
const sh=bg.firstChild;let y0=0,dy=0,dr=false,gone=false;
const close=cb=>{if(gone)return;gone=true;bg.classList.add('out');sh.style.transition='transform .18s';sh.style.transform='translateY(100%)';setTimeout(()=>{bg.remove();cb&&cb()},190)};
bg.addEventListener('click',e=>{if(e.target===bg)close()});
sh.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;dr=true;sh.style.transition='none'},{passive:true});
sh.addEventListener('touchmove',e=>{if(!dr)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});
sh.addEventListener('touchend',()=>{dr=false;sh.style.transition='transform .18s';if(dy>70)close();else sh.style.transform=''});
bg.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=A.find(x=>x[0]===b.dataset.a);close(a[4])});
document.body.append(bg)}
/* ---------- v7 shell ---------- */
let LF=null;
function buildNav(){$('#nav').innerHTML='<i class="ind"></i>'+TABS.map(([k,l])=>`<button data-t="${k}" onclick="go('${k}')" aria-label="${l}">${SV(IC[k])}<span>${l}</span></button>`).join('')}
function setNav(t){const n=$('#nav'),bs=n.querySelectorAll('button');bs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));const b=n.querySelector('button.on'),i=n.querySelector('.ind');if(b&&i&&b.offsetWidth){i.style.width=(b.offsetWidth-8)+'px';i.style.transform='translateX('+(b.offsetLeft+4)+'px)'}document.documentElement.style.setProperty('--nh',n.offsetHeight+'px')}
const go=t=>{tab=t;q='';per='all';render(true);scrollTo(0,0)};
function render(enter){const t=tab==='arch'?'box':tab,V=$('#v');setNav(t);
V.className=enter&&S.k.anim!==false?'enter':'';
V.innerHTML=tab==='home'?vHome():tab==='cart'?vSales():tab==='debt'?vDebts():tab==='more'?vMore():vProducts();
if(enter)[...V.firstChild.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,9)));
LF=tab==='box'||tab==='arch'?plist:tab==='cart'?slist:tab==='debt'?dlist:null;
$('#ttl').textContent=t==='home'?'KOPTAN':TABS.find(x=>x[0]===t)[1];
$('#cb').textContent=S.k.cur==='USD'?'$':'ل.ل';$('#hb').innerHTML=SV(S.k.hide?LU.eyeoff:LU.eye);$('#hb').setAttribute('aria-label',S.k.hide?'إظهار المبالغ':'إخفاء المبالغ');
anim();const sq=$('#sq');if(sq&&LF)sq.oninput=e=>{q=e.target.value;$('#lst').innerHTML=LF()};
fillSub()}
$('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&importJ(f)};
$('#fab').onclick=()=>quickAdd();
$('#cb').onclick=async()=>{S.k.cur=S.k.cur==='USD'?'LBP':'USD';await saveK();render()};
$('#hb').onclick=async()=>{S.k.hide=!S.k.hide;await saveK();buzz(6);render()};
$('#gb').onclick=()=>gsearch();
$('#dt').textContent=new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
addEventListener('resize',()=>setNav(tab==='arch'?'box':tab));
addEventListener('error',e=>toast('حدث خطأ: '+e.message));addEventListener('unhandledrejection',()=>toast('تعذر تنفيذ العملية'));
buildNav();$('#v').innerHTML='<div class="wrap"><div class="grid"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div></div>';
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
load().then(async()=>{document.body.classList.toggle('noanim',S.k.anim===false);await migImgs();await migSup();await runRec();if(S.k.pin)lock();if(memOnly)toast('التخزين غير متاح هنا: البيانات مؤقتة');render(true);sweepImgs();
const od=S.d.filter(d=>!d.arch&&dRem(d)>0&&d.due&&d.due<sod());if(od.length)setTimeout(()=>toast('لديك '+od.length+' دين متأخر'),900);
const a=new URLSearchParams(location.search).get('a'),A={prod:addProduct,sale:sellForm,exp:addExpense,debt:debtPage}[a];if(A&&!S.k.pin)setTimeout(()=>A(),300)});
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#gb').innerHTML=SV(LU.search);$('#fab').innerHTML=SV(LU.plus);

</script>
